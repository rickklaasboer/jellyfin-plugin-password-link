<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex">
    <title>Jellyfin</title>
    <link rel="stylesheet" href="Assets/set-password.css">
    <script type="module" src="Assets/set-password.js"></script>
</head>
<body>
    <main>
        <p class="server" id="server"></p>

        <section id="loading" aria-busy="true"></section>

        <section id="form-view" hidden>
            <h1 data-text="title"></h1>
            <p class="username"><span data-text="usernameLabel"></span> <strong id="username"></strong></p>
            <form id="form" novalidate>
                <!-- Lets password managers store the new password under the right username. -->
                <input id="username-field" type="text" autocomplete="username" hidden readonly>
                <label for="password" data-text="passwordLabel"></label>
                <div class="field">
                    <input id="password" type="password" autocomplete="new-password" required>
                    <button type="button" id="toggle" class="toggle" data-text="show"></button>
                </div>
                <p class="hint" id="hint"></p>
                <p class="error" id="error" role="alert"></p>
                <button type="submit" id="submit" class="primary" data-text="submit"></button>
            </form>
        </section>

        <section id="done-view" hidden>
            <h1 data-text="doneTitle"></h1>
            <p id="done-text"></p>
            <a class="primary" href="../web/" data-text="signIn"></a>
        </section>

        <section id="invalid-view" hidden>
            <h1 data-text="invalidTitle"></h1>
            <p data-text="invalidText"></p>
        </section>
    </main>
</body>
</html>
